services:
  - type: web
    name: student-progress-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash startup.sh
    repo: https://github.com/gaurishankar-commits/Student_progress.db.git
    branch: main
    envVars:
      - key: FLASK_SECRET_KEY
        value: academic-progression-dbms-secret-key-2024
      - key: DB_BACKEND
        value: sqlite
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: ""
      - key: DB_NAME
        value: astudent_progress
      - key: GOOGLE_APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbxQ1hHUjpgaP0p-Z3tz-EJ3r_EHFtdvEPaaLCZVLZYG2oVJGbiOvOOFI_ls4F5WAYwZ/exec
      - key: GOOGLE_SHEET_ID
        value: 14-FVo3H8LjybXtv_CWbphvgf46IZ1ahwf7mRlmwg29M
